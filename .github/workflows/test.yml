name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Local mode smoke test and regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unittest regression suite
        run: python -m unittest discover -s tests -v

      - name: Run local mode on the synthetic demo log
        run: TRIAGE_LOCAL_MODE=1 python triage_agent.py demo/sample-crash.log -o report-ci.md

      - name: Verify the report was generated
        run: test -s report-ci.md

      - name: Run local mode JSON output
        run: |
          TRIAGE_LOCAL_MODE=1 python triage_agent.py demo/sample-crash.log --format json -o report-ci.json
          python -c "import json; data = json.load(open('report-ci.json', encoding='utf-8')); assert data['schema_version'] == '1.0.0'; assert data['evidence']; assert data['environment']['game_version'] == '1.21.1'"

      - name: Check JSON stdout is parseable
        run: TRIAGE_LOCAL_MODE=1 python triage_agent.py demo/sample-crash.log --format json | python -c "import json, sys; json.load(sys.stdin)"

      - name: Validate the Skill JSON contract
        run: python skills/mod-issue-triage/scripts/validate_issue_json.py report-ci.json

      - name: Validate every Skill eval case
        run: |
          for case in skills/mod-issue-triage/evals/cases/*.json; do
            python skills/mod-issue-triage/scripts/validate_issue_json.py --case "$case" --quiet
          done

      - name: Check CLI help and version exit successfully
        run: |
          python triage_agent.py --help > /dev/null
          python triage_agent.py --version

      - name: Check Bash installer syntax
        run: bash -n scripts/install.sh
